<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses · Evalio Admin</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/evalio.css?v=4" rel="stylesheet">
</head>
<body>
<div class="ev-shell">
  <aside class="ev-sidebar" id="ev-sidebar"></aside>
  <div class="ev-main">
    <header class="ev-topbar" id="ev-topbar"></header>
    <main class="ev-content">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <div><h1 class="ev-page-title">Courses</h1><p class="ev-sub">Courses group students, question banks and examinations.</p></div>
        <button class="btn btn-primary" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Add course</button>
      </div>
      <div class="row g-3 mt-2" id="cards"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js?v=4"></script>
<script src="../js/api.js?v=4"></script>
<script src="../js/auth.js?v=4"></script>
<script src="../js/ui.js?v=4"></script>
<script>
  /* Manage Courses (FR-03) */
  const session = Auth.require('admin');
  UI.adminShell(session, 'courses', 'Courses');
  const esc = UI.esc;
  let courses = [];

  async function load() {
    courses = await Api.list('courses');
    document.getElementById('cards').innerHTML = courses.map((c) => `<div class="col-md-6 col-xl-4"><div class="ev-card p-4 h-100 d-flex flex-column">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div class="ev-stat p-0"><div class="icon"><i class="bi bi-journal-bookmark"></i></div></div>${UI.badge(c.status)}
      </div>
      <h3 class="h6 fw-bold mt-3 mb-1">${esc(c.course_name)}</h3>
      <p class="small text-muted mb-3">${esc(c.description || 'No description')}</p>
      <div class="row text-center g-2 mt-auto">
        <div class="col-4"><div class="ev-tile neutral"><div class="v">${c.student_count}</div><div class="l">Students</div></div></div>
        <div class="col-4"><div class="ev-tile neutral"><div class="v">${c.question_count}</div><div class="l">Questions</div></div></div>
        <div class="col-4"><div class="ev-tile neutral"><div class="v">${c.exam_count}</div><div class="l">Exams</div></div></div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
        <span class="small text-muted">Created ${UI.fmtDate(c.created_at)}</span>
        <div><button class="btn btn-light btn-icon" title="Edit" data-edit="${c.course_id}"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-light btn-icon text-danger" title="Delete" data-del="${c.course_id}"><i class="bi bi-trash"></i></button></div>
      </div></div></div>`).join('') || `<div class="col-12"><div class="ev-card">${UI.empty('No courses yet.', 'journal')}</div></div>`;
    document.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => openForm(courses.find((c) => c.course_id === +b.dataset.edit))));
    document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => remove(courses.find((c) => c.course_id === +b.dataset.del))));
  }

  function openForm(c) {
    UI.formModal({
      title: c ? 'Edit course' : 'Add course', submitText: c ? 'Save changes' : 'Add course',
      values: c || { status: 'Active' },
      fields: [
        { name: 'course_name', label: 'Course name', required: true, maxlength: 100 },
        { name: 'description', label: 'Description', type: 'textarea', rows: 3 },
        { name: 'status', label: 'Status', type: 'select', options: [{ value: 'Active', label: 'Active' }, { value: 'Inactive', label: 'Inactive' }] }
      ],
      async onSubmit(v) {
        if (c) await Api.update('courses', c.course_id, v, session); else await Api.create('courses', v, session);
        UI.toast(c ? 'Course updated' : 'Course added'); load();
      }
    });
  }

  async function remove(c) {
    if (!(await UI.confirm({ title: `Delete ${c.course_name}?`, body: 'Only courses with no students or examinations can be deleted.', okText: 'Delete', okClass: 'btn-danger' }))) return;
    try { await Api.remove('courses', c.course_id, session); UI.toast('Course deleted'); load(); }
    catch (e) { UI.toast(e.message, 'danger'); }
  }

  document.getElementById('addBtn').onclick = () => openForm(null);
  load();
</script>
</body>
</html>
