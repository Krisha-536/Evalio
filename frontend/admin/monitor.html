<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Monitoring · Evalio Admin</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/evalio.css?v=4" rel="stylesheet">
</head>
<body>
<div class="ev-shell">
  <aside class="ev-sidebar" id="ev-sidebar"></aside>
  <div class="ev-main">
    <header class="ev-topbar" id="ev-topbar"></header>
    <main class="ev-content">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <div><h1 class="ev-page-title">Live Monitoring</h1><p class="ev-sub">Who is writing, how far they are, time left and security alerts — updates live.</p></div>
        <div class="d-flex gap-2 align-items-center">
          <span class="ev-badge success live" id="liveBadge"><span class="dot"></span>Live</span>
          <select class="form-select" id="examSel" style="min-width:260px"></select>
        </div>
      </div>

      <div class="row g-3 mt-2" id="stats"></div>

      <div class="row g-3 mt-1">
        <div class="col-xl-8">
          <div class="ev-card">
            <div class="ev-toolbar">
              <div class="ev-seg" style="grid-template-columns:repeat(4,auto)" id="tabs">
                <button class="active" data-f="">All</button><button data-f="In Progress">Writing</button><button data-f="done">Submitted</button><button data-f="Not Started">Not started</button>
              </div>
              <span class="ms-auto small text-muted" id="updated"></span>
            </div>
            <div class="table-responsive"><table class="table ev-table">
              <thead><tr><th>Student</th><th>Status</th><th>Progress</th><th>On question</th><th>Time left</th><th>Tab switches</th><th>Last activity</th></tr></thead>
              <tbody id="rows"></tbody>
            </table></div>
          </div>
        </div>
        <div class="col-xl-4">
          <div class="ev-card">
            <div class="ev-card-header"><h2 class="ev-card-title">Live events</h2><a class="small fw-semibold" href="activity.html">All logs</a></div>
            <ul class="ev-feed" id="feed"></ul>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js?v=4"></script>
<script src="../js/api.js?v=4"></script>
<script src="../js/auth.js?v=4"></script>
<script src="../js/ui.js?v=4"></script>
<script>
  /* Monitor Examination (FR-16). Mock: polls the store every 2 s and listens for
     changes from other tabs. Supabase: replaced by a Realtime subscription. */
  const session = Auth.require('admin');
  UI.adminShell(session, 'monitor', 'Live Monitoring');
  const esc = UI.esc;
  let examId = +UI.param('exam') || null, filter = '', data = null, prev = {};

  const ICONS = { 'Tab switch detected': ['shield-exclamation', 'danger'], 'Exam submitted': ['check2-circle', 'success'], 'Exam auto-submitted': ['alarm', 'danger'], 'Exam started': ['play-circle', ''], 'Exam resumed': ['arrow-repeat', ''] };

  function render() {
    if (!data) return;
    const rows = data.rows;
    const n = (f) => rows.filter(f).length;
    const writing = n((r) => r.status === 'In Progress');
    const done = n((r) => r.status === 'Submitted' || r.status === 'Auto-Submitted');
    const alerts = rows.reduce((s, r) => s + r.tab_switches, 0);
    const stat = (label, value, icon, tone) => `<div class="col-6 col-xl"><div class="ev-card ev-stat d-flex justify-content-between gap-2"><div><div class="label">${label}</div><div class="value">${value}</div></div><div class="icon ${tone}"><i class="bi bi-${icon}"></i></div></div></div>`;
    document.getElementById('stats').innerHTML =
      stat('Assigned', rows.length, 'people', 'neutral') + stat('Writing now', writing, 'pencil-square', 'warning') +
      stat('Submitted', done, 'check2-circle', 'success') + stat('Not started', n((r) => r.status === 'Not Started'), 'hourglass', '') +
      stat('Tab-switch alerts', alerts, 'shield-exclamation', 'danger');

    const list = rows.filter((r) => !filter || (filter === 'done' ? /Submitted/.test(r.status) : r.status === filter))
      .sort((a, b) => ({ 'In Progress': 0, 'Not Started': 2 }[a.status] ?? 1) - ({ 'In Progress': 0, 'Not Started': 2 }[b.status] ?? 1) || b.tab_switches - a.tab_switches);
    document.getElementById('rows').innerHTML = list.length ? list.map((r) => {
      const pct = Math.round((r.answered / r.total) * 100);
      const changed = prev[r.student_id] && prev[r.student_id] !== `${r.answered}|${r.status}|${r.tab_switches}`;
      return `<tr class="${changed ? 'ev-row-flash' : ''}">
        <td><div class="d-flex align-items-center gap-2"><span class="ev-avatar">${esc(UI.initials(r.name))}</span><div><div class="strong">${esc(r.name)}</div><div class="small text-muted">${esc(r.enrollment_no)}</div></div></div></td>
        <td>${UI.badge(r.status)}${r.score != null ? `<div class="small text-muted mt-1">Score ${UI.num(r.score)}</div>` : ''}</td>
        <td class="text-nowrap">${r.status === 'Not Started' ? '<span class="text-muted">—</span>' : `<span class="ev-mini-bar"><div style="width:${pct}%"></div></span> <span class="small ms-1">${r.answered}/${r.total}</span>`}</td>
        <td>${r.status === 'In Progress' ? `Q${r.current}` : '<span class="text-muted">—</span>'}</td>
        <td class="tabular ${r.remaining_ms != null && r.remaining_ms < 5 * 60e3 ? 'text-danger fw-bold' : ''}">${r.remaining_ms != null ? UI.fmtClock(r.remaining_ms) : '<span class="text-muted">—</span>'}</td>
        <td>${r.tab_switches ? `<span class="ev-badge danger"><i class="bi bi-shield-exclamation"></i>${r.tab_switches}</span>` : '<span class="text-muted">0</span>'}</td>
        <td class="small text-muted">${r.last_activity ? UI.relTime(r.last_activity) : '—'}</td></tr>`;
    }).join('') : `<tr><td colspan="7">${UI.empty('No students in this view.', 'people')}</td></tr>`;
    rows.forEach((r) => { prev[r.student_id] = `${r.answered}|${r.status}|${r.tab_switches}`; });

    document.getElementById('feed').innerHTML = data.events.length ? data.events.map((l) => {
      const [icon, tone] = ICONS[l.action] || ['activity', ''];
      return `<li><span class="ic ${tone}"><i class="bi bi-${icon}"></i></span><div><div><b class="text-ink">${esc(l.user_name)}</b> · ${esc(l.action)}</div><div class="text-muted">${esc(l.details)}</div><div class="text-muted" style="font-size:.7rem">${UI.relTime(l.created_at)}</div></div></li>`;
    }).join('') : UI.empty('No events yet.', 'activity');
    document.getElementById('updated').textContent = `Updated ${UI.fmtTime(Date.now())}:${String(new Date().getSeconds()).padStart(2, '0')}`;
  }

  async function refresh() {
    if (!examId) return;
    try { data = await Api.monitor(examId); render(); }
    catch (e) { UI.toast(e.message, 'danger'); }
  }

  (async () => {
    const exams = (await Api.list('examinations')).filter((e) => e.status !== 'Draft' && e.question_count);
    const live = exams.filter((e) => e.status === 'Active');
    const sel = document.getElementById('examSel');
    sel.innerHTML = (live.length ? `<optgroup label="Live now">${live.map((e) => `<option value="${e.exam_id}">${esc(e.exam_name)}</option>`).join('')}</optgroup>` : '')
      + `<optgroup label="Other">${exams.filter((e) => e.status !== 'Active').map((e) => `<option value="${e.exam_id}">${esc(e.exam_name)} (${e.status})</option>`).join('')}</optgroup>`;
    if (!examId) examId = (live[0] || exams[0] || {}).exam_id;
    if (!examId) { document.getElementById('rows').innerHTML = `<tr><td colspan="7">${UI.empty('No examinations to monitor yet.', 'broadcast')}</td></tr>`; return; }
    sel.value = examId;
    sel.onchange = () => { examId = +sel.value; prev = {}; history.replaceState(null, '', `?exam=${examId}`); refresh(); };
    await refresh();
    setInterval(refresh, 2000);
    // Demo only: move the simulated students forward so the screen is "live"
    setInterval(() => Api.simulateTick().catch(() => {}), 3500);
    // A real student writing in another tab of this browser shows up instantly
    window.addEventListener('storage', (e) => { if (e.key === EvalioDB.KEY) refresh(); });
  })();

  document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('active', x === b));
    render();
  }));
</script>
</body>
</html>
