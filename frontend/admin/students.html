<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students · Evalio Admin</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/evalio.css?v=4" rel="stylesheet">
</head>
<body>
<div class="ev-shell">
  <aside class="ev-sidebar" id="ev-sidebar"></aside>
  <div class="ev-main">
    <header class="ev-topbar" id="ev-topbar"></header>
    <main class="ev-content">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <div><h1 class="ev-page-title">Students</h1><p class="ev-sub">Register students, assign them to a course and manage their accounts.</p></div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-primary" id="exportBtn"><i class="bi bi-file-earmark-excel me-1"></i>Export</button>
          <button class="btn btn-primary" id="addBtn"><i class="bi bi-person-plus me-1"></i>Add student</button>
        </div>
      </div>

      <div class="ev-card mt-4">
        <div class="ev-toolbar">
          <div class="ev-search"><i class="bi bi-search"></i><input class="form-control" id="q" placeholder="Search name, ID or email"></div>
          <select class="form-select" id="fCourse"><option value="">All courses</option></select>
          <select class="form-select" id="fStatus"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select>
          <span class="ms-auto small text-muted" id="count"></span>
        </div>
        <div class="table-responsive"><table class="table ev-table">
          <thead><tr><th>Student</th><th>Student ID</th><th>Course</th><th>Phone</th><th>Status</th><th>Registered</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/db.js?v=4"></script>
<script src="../js/api.js?v=4"></script>
<script src="../js/auth.js?v=4"></script>
<script src="../js/ui.js?v=4"></script>
<script>
  /* Manage Students (FR-03) */
  const session = Auth.require('admin');
  UI.adminShell(session, 'students', 'Students');
  const esc = UI.esc;
  let students = [], courses = [];

  function filtered() {
    const q = document.getElementById('q').value.toLowerCase();
    const c = document.getElementById('fCourse').value, s = document.getElementById('fStatus').value;
    return students.filter((x) => (!q || [x.name, x.enrollment_no, x.email].some((v) => v.toLowerCase().includes(q)))
      && (!c || x.course_id === +c) && (!s || x.status === s));
  }

  function render() {
    const list = filtered();
    document.getElementById('count').textContent = `${list.length} of ${students.length} students`;
    document.getElementById('rows').innerHTML = list.length ? list.map((x) => `<tr>
      <td><div class="d-flex align-items-center gap-2"><span class="ev-avatar">${esc(UI.initials(x.name))}</span><div><div class="strong">${esc(x.name)}</div><div class="small text-muted">${esc(x.email)}</div></div></div></td>
      <td class="tabular">${esc(x.enrollment_no)}</td><td>${esc(x.course_name)}</td><td class="tabular">${esc(x.phone || '—')}</td>
      <td>${UI.badge(x.status)}</td><td class="small">${UI.fmtDate(x.created_at)}</td>
      <td class="text-end text-nowrap">
        <button class="btn btn-light btn-icon" title="Edit" data-edit="${x.student_id}"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-light btn-icon" title="${x.status === 'Active' ? 'Deactivate' : 'Activate'}" data-toggle="${x.student_id}"><i class="bi bi-${x.status === 'Active' ? 'pause-circle' : 'play-circle'}"></i></button>
        <button class="btn btn-light btn-icon text-danger" title="Delete" data-del="${x.student_id}"><i class="bi bi-trash"></i></button>
      </td></tr>`).join('') : `<tr><td colspan="7">${UI.empty('No students match these filters.', 'people')}</td></tr>`;
    document.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => openForm(students.find((x) => x.student_id === +b.dataset.edit))));
    document.querySelectorAll('[data-toggle]').forEach((b) => (b.onclick = () => toggle(students.find((x) => x.student_id === +b.dataset.toggle))));
    document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => remove(students.find((x) => x.student_id === +b.dataset.del))));
  }

  async function load() {
    [students, courses] = await Promise.all([Api.list('students'), Api.list('courses')]);
    const sel = document.getElementById('fCourse');
    if (sel.options.length === 1) sel.insertAdjacentHTML('beforeend', courses.map((c) => `<option value="${c.course_id}">${esc(c.course_name)}</option>`).join(''));
    render();
  }

  function openForm(s) {
    const editing = !!s;
    UI.formModal({
      title: editing ? `Edit ${s.name}` : 'Add student',
      submitText: editing ? 'Save changes' : 'Add student',
      size: 'modal-lg',
      values: s ? { ...s, password: '' } : { status: 'Active' },
      fields: [
        { name: 'name', label: 'Full name', required: true, col: 6, maxlength: 100 },
        { name: 'enrollment_no', label: 'Student ID', required: true, col: 6, placeholder: 'e.g. 21CS1090', pattern: '[A-Za-z0-9]{4,20}', invalid: 'Use 4–20 letters or digits.' },
        { name: 'email', label: 'Email', type: 'email', required: true, col: 6 },
        { name: 'phone', label: 'Phone', col: 6, pattern: '[0-9+ ]{7,15}', invalid: 'Enter a valid phone number.' },
        { name: 'course_id', label: 'Course', type: 'select', required: true, col: 6, placeholder: 'Select course', options: courses.map((c) => ({ value: c.course_id, label: c.course_name + (c.status === 'Inactive' ? ' (inactive)' : '') })) },
        { name: 'status', label: 'Status', type: 'select', col: 6, options: [{ value: 'Active', label: 'Active' }, { value: 'Inactive', label: 'Inactive' }] },
        { name: 'password', label: editing ? 'New password' : 'Password', type: 'password', required: !editing, col: 12, min: null, placeholder: editing ? 'Leave blank to keep the current password' : 'At least 8 characters', pattern: '.{8,}', invalid: 'At least 8 characters.', help: 'Stored as a hash on the server. Share it with the student securely.' }
      ],
      async onSubmit(v) {
        const data = { ...v, course_id: +v.course_id, enrollment_no: v.enrollment_no.toUpperCase() };
        if (!data.password) delete data.password;
        if (editing) await Api.update('students', s.student_id, data, session);
        else await Api.create('students', data, session);
        UI.toast(editing ? 'Student updated' : 'Student added');
        load();
      }
    });
  }

  async function toggle(s) {
    const to = s.status === 'Active' ? 'Inactive' : 'Active';
    await Api.update('students', s.student_id, { status: to }, session);
    UI.toast(`${s.name} is now ${to.toLowerCase()}`);
    load();
  }

  async function remove(s) {
    if (!(await UI.confirm({ title: `Delete ${s.name}?`, body: 'This permanently removes the student account. Students with examination records cannot be deleted — deactivate them instead.', okText: 'Delete', okClass: 'btn-danger' }))) return;
    try { await Api.remove('students', s.student_id, session); UI.toast('Student deleted'); load(); }
    catch (e) { UI.toast(e.message, 'danger'); }
  }

  document.getElementById('addBtn').onclick = () => openForm(null);
  ['q', 'fCourse', 'fStatus'].forEach((id) => (document.getElementById(id).oninput = render));
  document.getElementById('exportBtn').onclick = () => UI.exportExcel('evalio-students.xlsx', {
    Students: filtered().map((s) => ({ 'Student ID': s.enrollment_no, Name: s.name, Email: s.email, Phone: s.phone, Course: s.course_name, Status: s.status, Registered: UI.fmtDate(s.created_at) }))
  });
  document.getElementById('rows').innerHTML = `<tr><td colspan="7">${UI.skeleton(160)}</td></tr>`;
  load();
</script>
</body>
</html>
