<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results · Evalio Admin</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/evalio.css?v=4" rel="stylesheet">
</head>
<body>
<div class="ev-shell">
  <aside class="ev-sidebar" id="ev-sidebar"></aside>
  <div class="ev-main">
    <header class="ev-topbar" id="ev-topbar"></header>
    <main class="ev-content">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <div><h1 class="ev-page-title">Results</h1><p class="ev-sub">Automatically evaluated results per examination. Publish them to make them visible to students.</p></div>
        <select class="form-select" id="examSel" style="max-width:340px"></select>
      </div>

      <div class="ev-card p-4 mt-4 d-flex flex-wrap justify-content-between align-items-center gap-3" id="publishBar"></div>

      <div class="row g-3 mt-1" id="stats"></div>

      <div class="ev-card mt-3">
        <div class="ev-toolbar">
          <div class="ev-search"><i class="bi bi-search"></i><input class="form-control" id="q" placeholder="Search student"></div>
          <select class="form-select" id="fStatus"><option value="">Pass & fail</option><option>Pass</option><option>Fail</option></select>
          <div class="ms-auto d-flex gap-2 no-print">
            <button class="btn btn-outline-primary btn-sm" id="excelBtn"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button>
            <button class="btn btn-outline-primary btn-sm" onclick="window.print()"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</button>
          </div>
        </div>
        <div class="table-responsive"><table class="table ev-table">
          <thead><tr><th>Rank</th><th>Student</th><th>Score</th><th>%</th><th>Correct / Wrong / Skipped</th><th>Time taken</th><th>Submission</th><th>Result</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/db.js?v=4"></script>
<script src="../js/api.js?v=4"></script>
<script src="../js/auth.js?v=4"></script>
<script src="../js/ui.js?v=4"></script>
<script>
  /* Manage / Publish Results (FR-14) */
  const session = Auth.require('admin');
  UI.adminShell(session, 'results', 'Results');
  const esc = UI.esc;
  let examId = +UI.param('exam') || null, data = null;

  function filtered() {
    const q = document.getElementById('q').value.toLowerCase(), s = document.getElementById('fStatus').value;
    return data.rows.filter((r) => (!q || r.name.toLowerCase().includes(q) || r.enrollment_no.toLowerCase().includes(q)) && (!s || r.result_status === s));
  }

  function render() {
    const e = data.exam, st = data.stats;
    document.getElementById('publishBar').innerHTML = `
      <div><div class="fw-bold text-ink">${esc(e.exam_name)}</div>
      <div class="small text-muted">${esc(e.subject)} · ${e.question_count} questions · ${UI.num(e.total_marks)} marks · pass ${UI.num(e.passing_marks)} · ${UI.badge(e.status)}</div></div>
      <div class="d-flex align-items-center gap-3">
        <span class="small">${e.result_published ? '<i class="bi bi-eye text-success me-1"></i>Students can see their results' : '<i class="bi bi-eye-slash text-muted me-1"></i>Hidden from students'}</span>
        <button class="btn ${e.result_published ? 'btn-outline-danger' : 'btn-primary'}" id="pubBtn">${e.result_published ? 'Withdraw results' : 'Publish results'}</button>
      </div>`;
    document.getElementById('pubBtn').onclick = togglePublish;

    const stat = (label, value, hint) => `<div class="col-6 col-xl"><div class="ev-card ev-stat"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint || '&nbsp;'}</div></div></div>`;
    document.getElementById('stats').innerHTML = st
      ? stat('Submitted', st.attempted) + stat('Average', UI.num(st.average) + '%') + stat('Highest', UI.num(st.highest), `of ${UI.num(e.total_marks)}`) + stat('Lowest', UI.num(st.lowest), `of ${UI.num(e.total_marks)}`) + stat('Pass rate', Math.round(st.pass_rate) + '%')
      : '';

    const list = filtered();
    document.getElementById('rows').innerHTML = list.length ? list.map((r) => `<tr>
      <td class="fw-bold text-ink">${r.rank <= 3 ? ['🥇', '🥈', '🥉'][r.rank - 1] : r.rank}</td>
      <td><div class="strong">${esc(r.name)}</div><div class="small text-muted">${esc(r.enrollment_no)}</div></td>
      <td class="tabular"><b>${UI.num(r.score)}</b> / ${UI.num(e.total_marks)}</td>
      <td>${UI.pctBadge(r.percentage)}</td>
      <td class="small"><span class="text-success fw-semibold">${r.correct_answers}</span> / <span class="text-danger fw-semibold">${r.wrong_answers}</span> / <span class="text-muted">${r.total_questions - r.attempted_questions}</span></td>
      <td class="small">${UI.fmtDuration(r.time_taken_ms)}</td>
      <td>${UI.badge(r.submission)}${r.tab_switches ? ` <span class="ev-badge danger" title="Tab switches"><i class="bi bi-shield-exclamation"></i>${r.tab_switches}</span>` : ''}</td>
      <td>${UI.badge(r.result_status)}</td></tr>`).join('')
      : `<tr><td colspan="8">${UI.empty(data.rows.length ? 'No results match.' : 'No submissions for this examination yet.', 'award')}</td></tr>`;
  }

  async function load() {
    data = await Api.examResults(examId);
    render();
  }

  async function togglePublish() {
    const pub = !data.exam.result_published;
    if (!(await UI.confirm({
      title: pub ? 'Publish results?' : 'Withdraw results?',
      body: pub ? 'Students will see their score, answer review and analysis, and get a notification.' : 'Students will no longer see results for this examination.',
      okText: pub ? 'Publish' : 'Withdraw', okClass: pub ? 'btn-primary' : 'btn-danger'
    }))) return;
    await Api.setPublished(examId, pub, session);
    UI.toast(pub ? 'Results published — students notified' : 'Results withdrawn');
    load();
  }

  (async () => {
    const exams = (await Api.list('examinations')).filter((e) => e.question_count);
    const sel = document.getElementById('examSel');
    sel.innerHTML = exams.map((e) => `<option value="${e.exam_id}">${esc(e.exam_name)}${e.result_published ? '' : ' · unpublished'}</option>`).join('');
    if (!examId) examId = (exams.find((e) => e.status === 'Completed') || exams[0] || {}).exam_id;
    if (!examId) return;
    sel.value = examId;
    sel.onchange = () => { examId = +sel.value; history.replaceState(null, '', `?exam=${examId}`); load(); };
    load();
  })();
  ['q', 'fStatus'].forEach((id) => (document.getElementById(id).oninput = render));
  document.getElementById('excelBtn').onclick = () => UI.exportExcel(`evalio-results-${data.exam.exam_name.replace(/\W+/g, '-').toLowerCase()}.xlsx`, {
    Results: filtered().map((r) => ({ Rank: r.rank, 'Student ID': r.enrollment_no, Name: r.name, Score: r.score, 'Total marks': data.exam.total_marks, Percentage: r.percentage, Correct: r.correct_answers, Wrong: r.wrong_answers, Unattempted: r.total_questions - r.attempted_questions, 'Time taken': UI.fmtDuration(r.time_taken_ms), Submission: r.submission, 'Tab switches': r.tab_switches, Result: r.result_status }))
  });
  document.getElementById('rows').innerHTML = `<tr><td colspan="8">${UI.skeleton(200)}</td></tr>`;
</script>
</body>
</html>
