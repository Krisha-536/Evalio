<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Examinations · Evalio Admin</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/evalio.css?v=3" rel="stylesheet">
</head>
<body>
<div class="ev-shell">
  <aside class="ev-sidebar" id="ev-sidebar"></aside>
  <div class="ev-main">
    <header class="ev-topbar" id="ev-topbar"></header>
    <main class="ev-content">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <div><h1 class="ev-page-title">Examinations</h1><p class="ev-sub">Create examinations from the question bank, then schedule and publish them.</p></div>
        <a class="btn btn-primary" href="exam-form.html"><i class="bi bi-file-earmark-plus me-1"></i>Create examination</a>
      </div>

      <div class="ev-card mt-4">
        <div class="ev-toolbar">
          <div class="ev-seg" style="grid-template-columns:repeat(5,auto)" id="tabs">
            <button class="active" data-s="">All</button><button data-s="Draft">Draft</button><button data-s="Scheduled">Scheduled</button><button data-s="Active">Active</button><button data-s="Completed">Completed</button>
          </div>
          <div class="ev-search ms-auto"><i class="bi bi-search"></i><input class="form-control" id="q" placeholder="Search examinations"></div>
        </div>
        <div class="table-responsive"><table class="table ev-table">
          <thead><tr><th>Examination</th><th>Questions</th><th>Duration</th><th>Marks (pass)</th><th>Rules</th><th>Window</th><th>Status</th><th>Results</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js?v=3"></script>
<script src="../js/api.js?v=3"></script>
<script src="../js/auth.js?v=3"></script>
<script src="../js/ui.js?v=3"></script>
<script>
  /* Create / manage examinations (FR-06) */
  const session = Auth.require('admin');
  UI.adminShell(session, 'exams', 'Examinations');
  const esc = UI.esc;
  let exams = [], status = '';

  function render() {
    const q = document.getElementById('q').value.toLowerCase();
    const list = exams.filter((e) => (!status || e.status === status) && (!q || e.exam_name.toLowerCase().includes(q) || e.subject.toLowerCase().includes(q)));
    document.getElementById('rows').innerHTML = list.length ? list.map((e) => `<tr>
      <td><div class="strong">${esc(e.exam_name)}</div><div class="small text-muted">${esc(e.subject)} · ${esc(e.course_name)}</div></td>
      <td>${e.question_count}</td><td>${e.duration} min</td>
      <td class="text-nowrap">${UI.num(e.total_marks)} <span class="text-muted">(${UI.num(e.passing_marks)})</span></td>
      <td class="small text-nowrap">
        ${e.negative_marking ? '<span class="ev-badge danger" title="Negative marking">−ve</span>' : ''}
        ${e.shuffle_questions ? '<span class="ev-badge primary" title="Randomized questions/options"><i class="bi bi-shuffle"></i></span>' : ''}
      </td>
      <td class="small">${e.schedule ? `${UI.fmtDateTime(e.schedule.start_time)}<br><span class="text-muted">to ${UI.fmtDateTime(e.schedule.end_time)}</span>` : '<span class="text-muted">Not scheduled</span>'}</td>
      <td>${UI.badge(e.status)}</td>
      <td>${e.result_published ? UI.badge('Published') : '<span class="ev-badge neutral">Hidden</span>'}</td>
      <td class="text-end text-nowrap">
        <a class="btn btn-light btn-icon" title="Edit" href="exam-form.html?id=${e.exam_id}"><i class="bi bi-pencil"></i></a>
        <a class="btn btn-light btn-icon" title="Schedule" href="schedule.html?exam=${e.exam_id}"><i class="bi bi-calendar-event"></i></a>
        ${e.status === 'Active' ? `<a class="btn btn-light btn-icon" title="Live monitor" href="monitor.html?exam=${e.exam_id}"><i class="bi bi-broadcast"></i></a>` : ''}
        <a class="btn btn-light btn-icon" title="Results" href="results.html?exam=${e.exam_id}"><i class="bi bi-award"></i></a>
        <button class="btn btn-light btn-icon text-danger" title="Delete" data-del="${e.exam_id}"><i class="bi bi-trash"></i></button>
      </td></tr>`).join('') : `<tr><td colspan="9">${UI.empty('No examinations here.', 'file-earmark-text')}</td></tr>`;
    document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => remove(exams.find((e) => e.exam_id === +b.dataset.del))));
  }

  async function load() {
    exams = (await Api.list('examinations')).sort((a, b) => b.exam_id - a.exam_id);
    render();
  }

  async function remove(e) {
    if (!(await UI.confirm({ title: `Delete ${e.exam_name}?`, body: 'The examination, its question list and its schedule will be removed. Examinations that students have attempted cannot be deleted.', okText: 'Delete', okClass: 'btn-danger' }))) return;
    try { await Api.remove('examinations', e.exam_id, session); UI.toast('Examination deleted'); load(); }
    catch (ex) { UI.toast(ex.message, 'danger'); }
  }

  document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => {
    status = b.dataset.s;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('active', x === b));
    render();
  }));
  document.getElementById('q').oninput = render;
  document.getElementById('rows').innerHTML = `<tr><td colspan="9">${UI.skeleton(160)}</td></tr>`;
  load();
</script>
</body>
</html>
