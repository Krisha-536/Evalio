<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instructions · Evalio</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/evalio.css?v=4" rel="stylesheet">
</head>
<body>
<header id="ev-nav"></header>

<main class="container py-4 py-lg-5" style="max-width:920px" id="root">
  <div class="ev-skel mb-3" style="height:40px;width:60%"></div>
  <div class="ev-skel mb-3" style="height:90px"></div>
  <div class="ev-skel" style="height:260px"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js?v=4"></script>
<script src="../js/api.js?v=4"></script>
<script src="../js/auth.js?v=4"></script>
<script src="../js/ui.js?v=4"></script>
<script>
  const session = Auth.require('student');
  UI.studentNav(session, 'exams');
  const esc = UI.esc;
  const examId = +UI.param('exam');
  const root = document.getElementById('root');

  Api.examInfo(examId, session.id).then((e) => {
    const resume = e.attempt && e.attempt.status === 'In Progress';
    const rules = [
      'Do not refresh the page during the examination. Your answers are saved automatically, so if you get disconnected you can resume.',
      'Submit before the timer ends. The exam auto-submits at zero.',
      'Each question has exactly one correct answer.',
      'You can mark questions for review and return to them anytime.',
      e.negative_marking
        ? 'Negative marking applies: a wrong answer deducts marks as shown on each question. Unattempted questions score zero.'
        : 'There is no negative marking for incorrect answers.',
      `Do not switch tabs or leave the exam window. Each switch is logged; after ${e.max_tab_switches} switches your exam is submitted automatically.`,
      'Signing in on another device or tab will immediately end this exam session (single-device login policy).'
    ];
    if (e.shuffle_questions) rules.splice(3, 0, 'Questions and options appear in a randomized order for every student.');

    root.innerHTML = `
      <a href="exams.html" class="small fw-semibold d-inline-block mb-3"><i class="bi bi-arrow-left me-1"></i>My Exams</a>
      <div><span class="ev-chip">${esc(e.course_name)}</span></div>
      <h1 class="ev-page-title mt-2">${esc(e.exam_name)}</h1>
      ${e.description ? `<p class="ev-sub">${esc(e.description)}</p>` : ''}

      <div class="ev-card p-4 mt-4"><div class="row g-3">
        <div class="col-6 col-md-3 ev-bigstat"><div class="l">Subject</div><div class="v" style="font-size:1.05rem">${esc(e.subject)}</div></div>
        <div class="col-6 col-md-3 ev-bigstat"><div class="l">Duration</div><div class="v" style="font-size:1.05rem">${e.duration} minutes</div></div>
        <div class="col-6 col-md-3 ev-bigstat"><div class="l">Questions</div><div class="v" style="font-size:1.05rem">${e.question_count}</div></div>
        <div class="col-6 col-md-3 ev-bigstat"><div class="l">Total Marks</div><div class="v" style="font-size:1.05rem">${UI.num(e.total_marks)} <span class="small text-muted fw-normal">(pass ${UI.num(e.passing_marks)})</span></div></div>
      </div></div>

      <div class="ev-card p-4 mt-3">
        <h2 class="h6 fw-bold mb-3">Examination Instructions</h2>
        <ol class="ev-steps">${rules.map((r, i) => `<li><span class="n">${i + 1}</span><span>${esc(r)}</span></li>`).join('')}</ol>
        ${e.schedule ? `<div class="small text-muted mt-3"><i class="bi bi-calendar-event me-1"></i>Window: ${UI.fmtDateTime(e.schedule.start_time)} – ${UI.fmtDateTime(e.schedule.end_time)}</div>` : ''}
      </div>

      ${e.can_start ? `
      <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mt-4">
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="agree" ${resume ? 'checked' : ''}>
          <label class="form-check-label small" for="agree">I have read and understood the instructions</label>
        </div>
        <button class="btn btn-primary" id="startBtn" ${resume ? '' : 'disabled'}>${resume ? 'Resume Examination' : 'Start Examination'}</button>
      </div>
      ${resume ? '<div class="alert alert-warning small mt-3 mb-0"><i class="bi bi-hourglass-split me-1"></i>You already started this examination. The timer kept running and your saved answers will be restored.</div>' : ''}`
      : `<div class="alert alert-info small mt-4 d-flex justify-content-between align-items-center gap-3 flex-wrap mb-0"><span><i class="bi bi-info-circle me-1"></i>${esc(e.block_reason)}</span>
          ${e.attempt && e.attempt.status !== 'In Progress' ? `<a class="btn btn-sm btn-primary" href="result.html?exam=${e.exam_id}">View result</a>` : ''}</div>`}
    `;

    if (!e.can_start) return;
    const agree = document.getElementById('agree');
    const btn = document.getElementById('startBtn');
    agree.onchange = () => { btn.disabled = !agree.checked; };
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = 'Preparing…';
      try {
        const attemptId = await Api.startAttempt(e.exam_id, session);
        // Fullscreen is best-effort; the exam still works without it
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
        location.href = `exam.html?attempt=${attemptId}`;
      } catch (ex) {
        UI.toast(ex.message, 'danger');
        btn.disabled = false; btn.textContent = 'Start Examination';
      }
    };
  }).catch((ex) => {
    root.innerHTML = `<div class="ev-card">${UI.empty(ex.message, 'exclamation-circle')}</div><div class="text-center mt-3"><a href="dashboard.html" class="btn btn-light">Back to Dashboard</a></div>`;
  });
</script>
</body>
</html>
