<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Result · Evalio</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/evalio.css?v=4" rel="stylesheet">
</head>
<body>
<header id="ev-nav"></header>

<main class="container py-4 py-lg-5" style="max-width:760px" id="root">
  <div class="ev-skel mx-auto mb-3" style="height:40px;width:55%"></div>
  <div class="ev-skel" style="height:200px"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js?v=4"></script>
<script src="../js/api.js?v=4"></script>
<script src="../js/auth.js?v=4"></script>
<script src="../js/ui.js?v=4"></script>
<script>
  /* Result Component (Exp 7 §Procedural Design 7) — mock-up 6: Result Page */
  const session = Auth.require('student');
  UI.studentNav(session, 'results');
  const esc = UI.esc;
  const examId = +UI.param('exam');
  const how = UI.param('submitted');
  const root = document.getElementById('root');

  function donut(pct) {
    const r = 54, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, pct) / 100);
    return `<div class="ev-donut"><svg width="132" height="132" viewBox="0 0 132 132">
      <circle cx="66" cy="66" r="${r}" fill="none" stroke="#e0e3ff" stroke-width="16"/>
      <circle cx="66" cy="66" r="${r}" fill="none" stroke="#4f46e5" stroke-width="16" stroke-linecap="butt" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
      </svg><div class="c"><div><b>${Math.round(pct)}%</b><small>Percentage</small></div></div></div>`;
  }

  Api.result(examId, session.id).then((d) => {
    const notice = how === 'auto' ? '<div class="alert alert-warning small"><i class="bi bi-alarm me-1"></i>Time ran out, so your examination was submitted automatically with all saved answers.</div>'
      : how === 'violation' ? '<div class="alert alert-danger small"><i class="bi bi-shield-exclamation me-1"></i>Your examination was submitted automatically because you left the examination window too many times.</div>'
      : how ? '<div class="alert alert-success small"><i class="bi bi-check-circle me-1"></i>Your examination was submitted successfully.</div>' : '';

    if (!d.published) {
      root.innerHTML = `${notice}
        <div class="ev-card p-5 text-center">
          <div class="ev-stat"><div class="icon warning mx-auto mb-3" style="width:56px;height:56px;font-size:1.5rem"><i class="bi bi-hourglass-split"></i></div></div>
          <h1 class="h4 fw-bold">Examination submitted</h1>
          <p class="text-muted mb-1">${esc(d.exam.exam_name)} · submitted ${UI.fmtDateTime(d.attempt.submitted_at)}</p>
          <p class="text-muted small">Your answers have been evaluated. The result will appear here as soon as the administrator publishes it — you will also get a notification.</p>
          <a href="dashboard.html" class="btn btn-primary mt-2">Back to Dashboard</a>
        </div>`;
      return;
    }

    const r = d.result;
    const unattempted = r.total_questions - r.attempted_questions;
    root.innerHTML = `${notice}
      <div class="text-center mb-4">
        <h1 class="ev-page-title">Examination Result</h1>
        <p class="ev-sub">${esc(d.student.name)} · ${esc(d.exam.exam_name)}</p>
      </div>
      <div class="ev-card p-4">
        <div class="d-flex flex-column flex-sm-row align-items-center gap-4">
          ${donut(r.percentage)}
          <div class="flex-grow-1 w-100">
            <div class="d-flex gap-4 align-items-end flex-wrap mb-3">
              <div class="ev-bigstat"><div class="l">Score Obtained</div><div class="v primary">${UI.num(r.score)}</div></div>
              <div class="ev-bigstat"><div class="l">Total Marks</div><div class="v">${UI.num(d.exam.total_marks)}</div></div>
              <div class="ev-bigstat"><div class="l mb-1">Status</div>${UI.badge(r.result_status === 'Pass' ? 'Passed' : 'Failed')}</div>
            </div>
            <div class="row g-2">
              <div class="col-4"><div class="ev-tile success"><div class="v">${r.correct_answers}</div><div class="l">Correct</div></div></div>
              <div class="col-4"><div class="ev-tile danger"><div class="v">${r.wrong_answers}</div><div class="l">Incorrect</div></div></div>
              <div class="col-4"><div class="ev-tile neutral"><div class="v">${unattempted}</div><div class="l">Unattempted</div></div></div>
            </div>
          </div>
        </div>
        <div class="small text-muted mt-3 pt-3 border-top d-flex flex-wrap gap-3 justify-content-between">
          <span>Passing marks: <b class="text-ink">${UI.num(d.exam.passing_marks)}</b></span>
          <span>Time taken: <b class="text-ink">${UI.fmtDuration(d.attempt.time_taken_ms)}</b></span>
          <span>Negative marking: <b class="text-ink">${d.exam.negative_marking ? 'Yes' : 'No'}</b></span>
          <span>Submission: <b class="text-ink">${esc(d.attempt.status)}</b></span>
        </div>
      </div>
      <div class="d-flex flex-wrap gap-2 justify-content-center mt-4 no-print">
        <a class="btn btn-primary" href="analysis.html?exam=${examId}">View Detailed Analysis</a>
        <a class="btn btn-outline-primary" href="result-card.html?exam=${examId}" target="_blank"><i class="bi bi-file-earmark-pdf me-1"></i>Result Card (PDF)</a>
        <a class="btn btn-outline-primary" href="dashboard.html">Back to Dashboard</a>
      </div>`;
  }).catch((e) => {
    root.innerHTML = `<div class="ev-card">${UI.empty(e.message, 'exclamation-circle')}</div><div class="text-center mt-3"><a href="dashboard.html" class="btn btn-light">Back to Dashboard</a></div>`;
  });
</script>
</body>
</html>
