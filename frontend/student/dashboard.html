<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Evalio</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/evalio.css" rel="stylesheet">
</head>
<body>
<header id="ev-nav"></header>

<main class="container-xl py-4 py-lg-5">
  <h1 class="ev-page-title" id="welcome">Welcome back</h1>
  <p class="ev-sub" id="welcomeSub">&nbsp;</p>

  <h2 class="ev-section-title">Available Examinations</h2>
  <div class="row g-3" id="available">
    
  </div>

  <div id="upcomingWrap" class="d-none">
    <h2 class="ev-section-title">Upcoming</h2>
    <div class="ev-card"><div class="table-responsive"><table class="table ev-table">
      <thead><tr><th>Examination</th><th>Opens</th><th>Closes</th><th>Duration</th><th class="text-end">Marks</th></tr></thead>
      <tbody id="upcoming"></tbody>
    </table></div></div>
  </div>

  <h2 class="ev-section-title">Recently Completed</h2>
  <div class="ev-card"><div class="table-responsive"><table class="table ev-table">
    <thead><tr><th>Examination</th><th>Date</th><th>Score</th><th class="text-end">Result</th></tr></thead>
    <tbody id="completed"></tbody>
  </table></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
  const session = Auth.require('student');
  UI.studentNav(session, 'dashboard');
  const esc = UI.esc;

  document.getElementById('available').innerHTML = [1, 2, 3].map(() => `<div class="col-md-6 col-lg-4">${UI.skeleton(210)}</div>`).join('');
  document.getElementById('completed').innerHTML = `<tr><td colspan="4">${UI.skeleton(60)}</td></tr>`;

  function examCard(e) {
    const inProgress = e.attempt && e.attempt.status === 'In Progress';
    return `<div class="col-md-6 col-lg-4"><div class="ev-card ev-exam-card">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <span class="ev-chip">${esc(e.course_name)}</span>
        ${inProgress ? '<span class="ev-badge warning live"><span class="dot"></span>In progress</span>' : ''}
      </div>
      <h3>${esc(e.exam_name)}</h3>
      <div class="ev-kv"><span>Questions</span><b>${e.question_count}</b></div>
      <div class="ev-kv"><span>Duration</span><b>${e.duration} minutes</b></div>
      <div class="ev-kv"><span>Total Marks</span><b>${UI.num(e.total_marks)}</b></div>
      <div class="meta-line"><i class="bi bi-clock me-1"></i>Open until ${UI.fmtDateTime(e.schedule.end_time)}</div>
      <a class="btn btn-primary w-100" href="instructions.html?exam=${e.exam_id}">${inProgress ? 'Resume Exam' : 'Start Exam'}</a>
    </div></div>`;
  }

  Api.studentExams(session.id).then((d) => {
    const first = session.name.split(' ')[0];
    document.getElementById('welcome').textContent = `Welcome back, ${first}`;
    const n = d.available.length;
    document.getElementById('welcomeSub').textContent = n
      ? `You have ${n} examination${n > 1 ? 's' : ''} available this week.`
      : 'You have no examinations open right now.';

    document.getElementById('available').innerHTML = n
      ? d.available.map(examCard).join('')
      : `<div class="col-12"><div class="ev-card">${UI.empty('No examinations are open right now. Check Upcoming below.', 'calendar2-check')}</div></div>`;

    if (d.upcoming.length) {
      document.getElementById('upcomingWrap').classList.remove('d-none');
      document.getElementById('upcoming').innerHTML = d.upcoming.map((e) => `<tr>
        <td><div class="strong">${esc(e.exam_name)}</div><div class="small text-muted">${esc(e.course_name)}</div></td>
        <td>${UI.fmtDateTime(e.schedule.start_time)}</td><td>${UI.fmtDateTime(e.schedule.end_time)}</td>
        <td>${e.duration} min</td><td class="text-end">${UI.num(e.total_marks)}</td></tr>`).join('');
    }

    const done = d.completed.slice(0, 5);
    document.getElementById('completed').innerHTML = done.length ? done.map((e) => `<tr>
        <td><a class="strong" href="result.html?exam=${e.exam_id}">${esc(e.exam_name)}</a></td>
        <td>${UI.fmtDate(e.attempt.submitted_at)}</td>
        <td>${e.result ? `${UI.num(e.result.score)} / ${UI.num(e.total_marks)}` : '<span class="text-muted">—</span>'}</td>
        <td class="text-end">${e.result ? UI.pctBadge(e.result.percentage) : UI.badge('Pending')}</td></tr>`).join('')
      : `<tr><td colspan="4">${UI.empty('You have not completed any examinations yet.', 'journal-check')}</td></tr>`;
  }).catch((e) => UI.toast(e.message, 'danger'));
</script>
</body>
</html>
