<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Exams · Evalio</title>
  <link rel="icon" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/evalio.css" rel="stylesheet">
</head>
<body>
<header id="ev-nav"></header>

<main class="container-xl py-4 py-lg-5">
  <h1 class="ev-page-title">My Exams</h1>
  <p class="ev-sub">Every examination assigned to your course, with its schedule and status.</p>

  <div class="ev-card mt-4">
    <div class="ev-toolbar">
      <div class="ev-seg" style="grid-template-columns:repeat(5,auto)" id="tabs">
        <button class="active" data-tab="all">All</button>
        <button data-tab="available">Available</button>
        <button data-tab="upcoming">Upcoming</button>
        <button data-tab="completed">Completed</button>
        <button data-tab="missed">Missed</button>
      </div>
      <div class="ev-search ms-auto"><i class="bi bi-search"></i><input class="form-control" id="q" placeholder="Search examinations"></div>
    </div>
    <div class="table-responsive"><table class="table ev-table">
      <thead><tr><th>Examination</th><th>Window</th><th>Questions</th><th>Duration</th><th>Marks</th><th>Status</th><th class="text-end"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
  const session = Auth.require('student');
  UI.studentNav(session, 'exams');
  const esc = UI.esc;
  let items = [], tab = 'all';
  document.getElementById('rows').innerHTML = `<tr><td colspan="7">${UI.skeleton(120)}</td></tr>`;

  function action(e) {
    if (e.kind === 'available') return `<a class="btn btn-primary btn-sm" href="instructions.html?exam=${e.exam_id}">${e.attempt ? 'Resume' : 'Start'}</a>`;
    if (e.kind === 'completed') return `<a class="btn btn-outline-primary btn-sm" href="result.html?exam=${e.exam_id}">View result</a>`;
    if (e.kind === 'upcoming') return `<a class="btn btn-light btn-sm" href="instructions.html?exam=${e.exam_id}">Details</a>`;
    return '';
  }
  function statusOf(e) {
    if (e.kind === 'available') return e.attempt ? UI.badge('In Progress') : UI.badge('Active');
    if (e.kind === 'upcoming') return UI.badge('Scheduled');
    if (e.kind === 'missed') return UI.badge('Missed');
    return e.result ? `${UI.badge(e.result.result_status)}` : UI.badge('Submitted');
  }
  function render() {
    const q = document.getElementById('q').value.toLowerCase();
    const list = items.filter((e) => (tab === 'all' || e.kind === tab) && (!q || e.exam_name.toLowerCase().includes(q) || e.subject.toLowerCase().includes(q)));
    document.getElementById('rows').innerHTML = list.length ? list.map((e) => `<tr>
      <td><div class="strong">${esc(e.exam_name)}</div><div class="small text-muted">${esc(e.subject)} · ${esc(e.course_name)}</div></td>
      <td class="small">${UI.fmtDateTime(e.schedule.start_time)}<br><span class="text-muted">to ${UI.fmtDateTime(e.schedule.end_time)}</span></td>
      <td>${e.question_count}</td><td>${e.duration} min</td>
      <td>${e.result ? `<b>${UI.num(e.result.score)}</b> / ${UI.num(e.total_marks)}` : UI.num(e.total_marks)}</td>
      <td>${statusOf(e)}</td><td class="text-end">${action(e)}</td></tr>`).join('')
      : `<tr><td colspan="7">${UI.empty('No examinations here.', 'calendar2-x')}</td></tr>`;
  }
  document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('active', x === b));
    render();
  }));
  document.getElementById('q').oninput = render;

  Api.studentExams(session.id).then((d) => {
    items = [
      ...d.available.map((e) => ({ ...e, kind: 'available' })),
      ...d.upcoming.map((e) => ({ ...e, kind: 'upcoming' })),
      ...d.completed.map((e) => ({ ...e, kind: 'completed' })),
      ...d.missed.map((e) => ({ ...e, kind: 'missed' }))
    ];
    render();
  }).catch((e) => UI.toast(e.message, 'danger'));
</script>
</body>
</html>
